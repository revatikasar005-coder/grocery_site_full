{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery Delight - Login</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
  body, html { height:100%; width:100%; overflow:hidden; }

  /* 🔹 Background Slideshow */
  .slideshow {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: -2;
    overflow: hidden;
  }
  .slideshow img {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    top: 0; left: 0;
    opacity: 0;
    transition: opacity 1.8s ease-in-out;
  }
  .slideshow img.active {
    opacity: 1;
  }

  /* Dark overlay */
  .overlay {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.55);
    z-index:-1;
  }

  /* 🔹 Center Container */
  .container {
    display: flex;
    justify-content: flex-end; /* right side */
    align-items: center;       /* vertical center */
    height: 100vh;
    width: 100vw;
    padding-right: 60px; /* gap from right */
  }

  /* 🔹 Login box */
  .login-box {
    background: rgba(255,255,255,0.97);
    padding: 50px 40px;
    border-radius: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    width: 420px;
    text-align:center;
    animation: slideIn 1.2s ease-out;
    transition: transform 0.5s, box-shadow 0.3s;
    z-index:1;
  }

  @keyframes slideIn {
    0% { opacity:0; transform: translateX(100px); }
    100% { opacity:1; transform: translateX(0); }
  }

  .login-box:hover {
    transform: scale(1.03);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .login-box h2 {
    margin-bottom: 30px;
    color: #219653;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* 🔹 Inputs */
  .login-box input {
    width: 100%;
    padding: 15px;
    margin: 12px 0;
    border-radius: 10px;
    border: 1px solid #ddd;
    outline: none;
    font-size: 16px;
    transition: 0.3s;
    background: #f9f9f9;
  }
  .login-box input:focus {
    border-color: #219653;
    background: #fff;
    box-shadow: 0 0 10px rgba(33,150,83,0.2);
  }

  /* Autofill fix */
  input:-webkit-autofill {
    box-shadow: 0 0 0px 1000px #f9f9f9 inset !important;
    -webkit-text-fill-color: #000 !important;
  }

  /* 🔹 Login button */
  .login-box button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(45deg, #219653, #27ae60);
    border: none;
    color: white;
    font-size: 18px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.3s, background 0.3s;
  }
  .login-box button:hover {
    transform: scale(1.05);
    background: linear-gradient(45deg, #27ae60, #2ecc71);
  }

  /* Password toggle */
  .password-container {
    position: relative;
  }
  .show-pass {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    color: #219653;
    transition: color 0.3s, transform 0.3s;
  }
  .show-pass:hover {
    color: #2ecc71;
    transform: translateY(-50%) scale(1.2);
  }

  /* Footer */
  footer {
    position: absolute;
    bottom: 15px;
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: 14px;
    z-index: 1;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <!-- 🔹 Background Slideshow -->
  <div class="slideshow">
    <img src="{% static 'images/login_bg.jpg' %}" class="active">
    
  </div>

  <!-- Dark Overlay -->
  <div class="overlay"></div>

  <!-- Login Box inside container -->
  <div class="container">
    <div class="login-box">
      <h2>Welcome to Grocery Delight</h2>
      <form method="POST" action="{% url 'index' %}" autocomplete="off">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" autocomplete="off" required>
        <div class="password-container">
          <input type="password" name="password" id="pass" placeholder="Password" autocomplete="new-password" required>
          <span class="show-pass" onclick="togglePass()">👁️‍🗨️</span>
        </div>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <footer>© 2025 Grocery Delight | Designed by Team RRA595</footer>

<script>
/* Password toggle */
function togglePass() {
  let p = document.getElementById('pass');
  p.type = p.type === "password" ? "text" : "password";
}

/* Slideshow transition (infinite loop) */
const images = document.querySelectorAll('.slideshow img');
let index = 0;

function showNextImage() {
  images[index].classList.remove('active');
  index = (index + 1) % images.length; // loop karega
  images[index].classList.add('active');
}
setInterval(showNextImage, 5000);
</script>

</body>
</html>
