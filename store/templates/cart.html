{% load static %}
<img src="{% static 'images/your_image.jpg' %}" alt="Product Image">
<h1>Your Cart</h1>
<ul>
  {% for item in items %}
    <li>
      {{ item.product.name }} (x{{ item.qty }}) - ₹{{ item.subtotal }}
      <a href="{% url 'remove_from_cart' item.product.pk %}">Remove</a>
    </li>
  {% endfor %}
</ul>
<p>Total: ₹{{ total }}</p>
<a href="{% url 'home' %}">Continue Shopping</a>
<link rel="stylesheet" href="{% static 'css/styles.css' %}">
