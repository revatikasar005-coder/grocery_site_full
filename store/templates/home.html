{% load static %}

<img src="{% static 'images/Hero1.jpg' %}" alt="Hero Image">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Grocery Delight</title>
    <style>
        /* ---------- Styles (same as before) ---------- */
        body{font-family:Arial, sans-serif;margin:0;padding:0;background:#f7f7f7;}
        .header{background:#4CAF50;color:#fff;text-align:center;padding:25px;font-size:28px;font-weight:bold;}
        .navbar{background:#2E7D32;display:flex;justify-content:center;gap:25px;padding:12px 0;}
        .navbar a{color:#fff;text-decoration:none;font-weight:bold;}
        .navbar a:hover{text-decoration:underline;}
        .search-area{padding:20px;text-align:center;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
        .search-area input,.search-area select{padding:7px;margin-right:5px;}
        .search-area button{padding:7px 15px;background:#4CAF50;color:#fff;border:none;cursor:pointer;}
        .search-area button:hover{background:#2E7D32;}
        .product-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;padding:30px 10px;}
        .product-card{background:#fff;border:1px solid #4CAF50;width:200px;padding:15px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
        .product-card img{width:100%;height:auto;}
        .product-card h3{color:#2E7D32;margin-top:10px;}
        .product-card p{margin:4px 0;}
        .btn{background:#4CAF50;color:#fff;border:none;padding:5px 10px;cursor:pointer;margin-top:5px;}
        .btn:hover{background:#2E7D32;}
        .footer{background:#2E7D32;color:#fff;text-align:center;padding:10px;margin-top:40px;}

        /* payment popup */
        .payment-box{
          display:none;
          position:fixed;top:50%;left:50%;
          transform:translate(-50%, -50%);
          background:#fff;padding:20px;border:1px solid #4CAF50;
          box-shadow:0 2px 8px rgba(0,0,0,0.2);
          z-index:10;
        }
        .overlay{
          display:none;position:fixed;top:0;left:0;width:100%;height:100%;
          background:rgba(0,0,0,0.4);z-index:5;
        }
    </style>
</head>
<body>

<div class="header">Grocery Delight</div>
<div class="navbar">
  <a href="#">Home</a>
  <a href="#">Offers</a>
  <a href="#">Deals</a>
  <a href="#">Logout</a>
</div>

<div class="search-area">
  <input id="searchInput" type="text" placeholder="Search for products..." onkeyup="filterCards()">
  <select id="categorySelect" onchange="filterCards()">
    <option value="">All Categories</option>
    <option value="Fruits & Vegetables">Fruits & Vegetables</option>
    <option value="Drinks">Drinks</option>
    <option value="Snacks">Snacks</option>
    <option value="Bakery">Bakery</option>
    <option value="Dairy">Dairy</option>
    <option value="Grocery">Grocery</option>
  </select>
</div>

<div class="product-grid" id="productGrid">
    <!-- EXAMPLE ITEMS -->
    <div class="product-card" data-name="Apples" data-category="Fruits & Vegetables">
        <img src="{% static 'images/Apples.jpg' %}" alt="Apples">
        <h3>Apples</h3>
        <p>Category: Fruits & Vegetables</p>
        <p>Price: ₹50</p>
        <button class="btn" onclick="showPayment()">Buy Now</button>
        <button class="btn">Add to Fav</button>
    </div>

    <div class="product-card" data-name="Beverages" data-category="Drinks">
        <img src="{% static 'images/Beverages.jpg' %}" alt="Beverages">
        <h3>Beverages</h3>
        <p>Category: Drinks</p>
        <p>Price: ₹60</p>
        <button class="btn" onclick="showPayment()">Buy Now</button>
        <button class="btn">Add to Fav</button>
    </div>

    <!-- 👉 (add all the other product blocks here; keep data-name and data-category correct) -->

</div>

<!-- -------- Payment Pop-up -------- -->
<div class="overlay" id="overlay"></div>
<div class="payment-box" id="paymentBox">
    <h3>Choose Payment Option</h3>
    <p><input type="radio" name="payment" checked> Cash on Delivery</p>
    <p><input type="radio" name="payment"> UPI (GooglePay / PhonePe)</p>
    <p><input type="radio" name="payment"> Credit/Debit Card</p>
    <button class="btn" onclick="confirmPayment()">Pay</button>
</div>

<div class="footer">© 2025 Grocery Delight. All rights reserved.</div>

<script>
function filterCards(){
  const search = document.getElementById('searchInput').value.toLowerCase();
  const category = document.getElementById('categorySelect').value;
  const cards = document.querySelectorAll('.product-card');

  cards.forEach(card=>{
      const name = card.dataset.name.toLowerCase();
      const cat  = card.dataset.category;

      const matchSearch = name.includes(search);
      const matchCategory = category === "" || cat === category;

      (matchSearch && matchCategory)
        ? card.style.display = "block"
        : card.style.display = "none";
  });
}

function showPayment(){
  document.getElementById('overlay').style.display="block";
  document.getElementById('paymentBox').style.display="block";
}

function confirmPayment(){
  alert("✅ Order placed successfully!");
  document.getElementById('overlay').style.display="none";
  document.getElementById('paymentBox').style.display="none";
}
</script>

</body>
</html>
